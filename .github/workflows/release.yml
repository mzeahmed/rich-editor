name: Release

# Publishes to npm when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# See RELEASING.md for the one-time setup and the steps.
on:
  push:
    tags: ['v*']

# Never two publications at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance (signed proof of where the package was built)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Optional: create an "npm" environment in the repository settings and require a reviewer, so a
    # human approves each publication.
    environment: npm
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Everything reaches `main` through a pull request whose CI passed: a tag on any other commit
      # (a branch, a draft) must never be published.
      - name: Check the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $TAG is not on main: merge the pull request first, then tag main."
            exit 1
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Tag = package.json version, dated and non-empty CHANGELOG section, empty [Unreleased],
      # license / repository / public access declared. Fails with the list of what is missing.
      - name: Check the release
        run: node scripts/release.mjs check "$TAG"

      - name: Tests
        run: npm test

      # `npm publish` runs `prepack` (build + check:package). A pre-release (v1.0.0-beta.1) is
      # published under the "next" dist-tag, never "latest".
      - name: Publish
        run: npm publish --provenance --access public --tag "$(node scripts/release.mjs tag "${TAG#v}")"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        run: |
          node scripts/release.mjs notes "${TAG#v}" > RELEASE_NOTES.md
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
