# =============================================================================
# rich-editor — quality pipeline
# =============================================================================
# Same model as the Yoostart API and front pipelines: pull requests run the
# quality checks only. Merging into `main` then triggers the follow-up
# workflows (sync-develop.yml); a release is a version tag, handled by
# release.yml.
#
# Nothing runs on a push to `main` here: the code was already checked in the
# pull request. The `Quality` job below is the single check to require in the
# branch protection of `main`; a failing job blocks the merge.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Unit and DOM tests
        run: npm test

      - name: Build
        run: npm run build

      # Imports the built package in Node, checks style.css and the declared exports.
      - name: Check the built package
        run: npm run check:package

      # Lists what would be published (and runs the build and the check again, as `npm publish` does).
      - name: Dry-run the package
        run: npm pack --dry-run

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only what ships to users (production dependencies).
      - run: npm audit --omit=dev --audit-level=high

  # The one check to require on `main`. Matrix job names change with the matrix, this one does not.
  # `always()` makes it run (and fail) when a job above failed or was cancelled, instead of being
  # skipped, which the protection would treat as passed.
  quality:
    name: Quality
    runs-on: ubuntu-latest
    needs: [test, audit]
    if: always()
    steps:
      - name: All checks passed
        run: |
          [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.audit.result }}" = "success" ] || {
            echo "Quality failed: tests=${{ needs.test.result }}, audit=${{ needs.audit.result }}"
            exit 1
          }
